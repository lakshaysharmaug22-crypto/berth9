# Full local stack: Berth 9 + PostgreSQL + SFTP partner drop + Kafka + Prometheus + Grafana.
#   docker compose -f deploy/docker-compose.yml up --build
# Console: http://localhost:8080   Grafana: http://localhost:3000 (admin/admin)
# Partners upload over SFTP: sftp -P 2222 partner@localhost (password: partner), into upload/<PARTNER_ID>/
services:
  berth9:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      BERTH9_INBOX_URI: "sftp://partner@sftp:22/upload?password=partner&recursive=true&move=.done&moveFailed=.error&readLock=changed&readLockMinLength=0&delay=2000&useUserKnownHostsFile=false&strictHostKeyChecking=no"
      BERTH9_KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      sftp: { condition: service_started }

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: berth9
      POSTGRES_USER: berth9
      POSTGRES_PASSWORD: berth9
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berth9"]
      interval: 5s
      retries: 10

  sftp:
    image: atmoz/sftp:alpine
    command: partner:partner:1001::upload
    ports: ["2222:22"]

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
