name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Java build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: berth9-server
          path: berth9-server/target/berth9-server-*.jar

  console:
    name: Angular console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: berth9-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: berth9-console/package-lock.json
      - run: npm ci
      - run: npx ng build
