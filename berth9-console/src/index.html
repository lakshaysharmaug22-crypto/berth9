<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Berth 9 · Partner Data Onboarding Console</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Berth 9 onboards messy partner data (Excel, CSV, EDI X12, cXML, fixed-width, JSON): maps it, validates it against purchase orders and delivers it with EDI acknowledgments.">
  <meta name="theme-color" content="#0b1f33">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('berth9-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
